name: Update GitHub stats
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_stats.py"
      - ".github/workflows/update-stats.yml"
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate card
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
        run: python3 scripts/update_stats.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-activity.svg assets/github-prs.svg
          git diff --cached --quiet || (git commit -m "Update GitHub stats" && git push)
